name: 缺陷报告
description: 报告可以用非敏感合成数据复现的问题
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        感谢报告问题。请勿提交 API Key、个人信息、真实未公开发明或客户资料。
  - type: checkboxes
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issues，确认没有重复报告
          required: true
        - label: 我使用的是合成或已脱敏的复现材料
          required: true
  - type: input
    attributes:
      label: 版本或 Commit
      placeholder: v0.1.0 或 commit SHA
    validations:
      required: true
  - type: dropdown
    attributes:
      label: 运行环境
      options:
        - Windows 11 + Microsoft Word
        - Windows 10 + Microsoft Word
        - Windows（无 Microsoft Word）
        - 其他
    validations:
      required: true
  - type: textarea
    attributes:
      label: 问题描述与复现步骤
      description: 请使用最小化、非敏感的样例描述实际结果和预期结果。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 脱敏日志
      description: 可选。粘贴前请删除路径、密钥、模型请求全文和个人信息。
      render: shell
